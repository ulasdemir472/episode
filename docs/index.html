<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Episode - Dizi & Film Takip</title>
  <style>
    :root {
      --bg: #07070A;
      --surface: #121217;
      --border: #22222B;
      --text: #F3F4F6;
      --muted: #9CA3AF;
      --primary: #FF5A47;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px 30px;
      max-width: 480px;
      width: 100%;
    }
    .logo {
      font-size: 36px;
      font-weight: 900;
      letter-spacing: -1.5px;
      margin-bottom: 8px;
    }
    .logo span { color: var(--primary); }
    p { color: var(--muted); font-size: 15px; margin-bottom: 24px; line-height: 1.5; }
    .links { display: flex; flex-direction: column; gap: 12px; }
    .btn {
      display: block;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 20px;
      border-radius: 9999px;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.2s;
    }
    .btn:hover {
      border-color: var(--primary);
      color: var(--primary);
    }
    .btn-primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }
    .btn-primary:hover {
      opacity: 0.9;
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">episode<span>.</span></div>
    <p>Film ve dizileri keşfetmek, izleme listelerini yönetmek ve yeni bölümleri takip etmek için modern mobil uygulama.</p>
    <div class="links">
      <a href="support.html" class="btn btn-primary">Destek & Yardım (Support)</a>
      <a href="privacy.html" class="btn">Gizlilik Politikası (Privacy Policy)</a>
    </div>
  </div>
</body>
</html>
