name: Mobile release
on:
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        options: [ios, android, all]
        default: ios
      auto_submit:
        type: boolean
        description: 'iOS: TestFlight; Android: internal test yuklemesi (--auto-submit)'
        default: true
      deploy_backend:
        type: boolean
        description: 'Canli backend dagitimi (TestFlight testi icin kapali birak)'
        default: false
permissions:
  contents: read
concurrency:
  group: episode-deployment-${{ github.repository }}
  cancel-in-progress: false
jobs:
  checks:
    if: ${{ !inputs.deploy_backend }}
    uses: ./.github/workflows/ci.yml
  backend:
    if: ${{ inputs.deploy_backend }}
    uses: ./.github/workflows/supabase-deploy.yml
    secrets: inherit
  build:
    needs: [checks, backend]
    if: ${{ !cancelled() && ((inputs.deploy_backend && needs.backend.result == 'success') || (!inputs.deploy_backend && needs.checks.result == 'success')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: EAS Build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          AUTO_SUBMIT: ${{ inputs.auto_submit }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          AUTO_SUBMIT_FLAG=""
          if [ "$AUTO_SUBMIT" = "true" ]; then
            AUTO_SUBMIT_FLAG="--auto-submit"
          fi
          eas build --platform "$PLATFORM" --profile production $AUTO_SUBMIT_FLAG --non-interactive --no-wait

