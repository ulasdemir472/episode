name: Mobile release
on:
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        options: [ios, android, all]
        default: ios
      auto_submit:
        type: boolean
        description: 'Otomatik TestFlight / Store gonderimi (--auto-submit)'
        default: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm validate
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: EAS Build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          AUTO_SUBMIT_FLAG=""
          if [ "${{ inputs.auto_submit }}" = "true" ]; then
            AUTO_SUBMIT_FLAG="--auto-submit"
          fi
          eas build --platform ${{ inputs.platform }} --profile production $AUTO_SUBMIT_FLAG --non-interactive --no-wait

