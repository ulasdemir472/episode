name: Mobile OTA update
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.github/workflows/release.yml'
      - '.github/workflows/supabase-migration.yml'
  workflow_dispatch:
    inputs:
      channel:
        type: choice
        description: 'Güncelleme kanalı'
        options: [production, preview]
        default: production
      message:
        type: string
        description: 'Güncelleme açıklaması'
        required: false
        default: 'OTA güncellemesi'
permissions:
  contents: read
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm validate
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: EAS Update
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          CHANNEL="${{ inputs.channel || 'production' }}"
          RAW_MSG="${{ inputs.message || github.event.head_commit.message || 'Auto OTA update on commit' }}"
          SAFE_MSG=$(echo "$RAW_MSG" | head -n 1 | cut -c 1-80)
          eas update --channel "$CHANNEL" --environment "$CHANNEL" --message "$SAFE_MSG" --non-interactive
