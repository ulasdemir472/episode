name: Mobile OTA update
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  workflow_dispatch:
    inputs:
      channel:
        type: choice
        description: 'Güncelleme kanalı'
        options: [preview, production]
        default: preview
      message:
        type: string
        description: 'Güncelleme açıklaması'
        required: false
        default: 'OTA güncellemesi'
permissions:
  contents: read
concurrency:
  group: episode-deployment-${{ github.repository }}
  cancel-in-progress: false
jobs:
  backend:
    uses: ./.github/workflows/supabase-deploy.yml
    secrets: inherit
  update:
    needs: backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: EAS Update
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          CHANNEL: ${{ inputs.channel || 'preview' }}
          RAW_MSG: ${{ inputs.message || github.event.head_commit.message || 'Auto OTA update on commit' }}
        run: |
          SAFE_MSG=$(printf '%s' "$RAW_MSG" | head -n 1 | cut -c 1-80)
          eas update --channel "$CHANNEL" --environment "$CHANNEL" --message "$SAFE_MSG" --non-interactive
